services:
  - type: web
    name: housing-tracker-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GMAIL_ADDRESS
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: ALERTS_SECRET
        sync: false
      - key: REPLIERS_API_KEY
        sync: false
      - key: CMHC_RENT_XLSX_URL
        sync: false
