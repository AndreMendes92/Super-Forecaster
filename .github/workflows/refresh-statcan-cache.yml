name: Refresh StatCan data cache

# Runs once a day, ahead of the alert check, and asks the backend to
# refresh its cache of StatCan housing data in the background. Live
# calls to StatCan are unreliable to make synchronously within a web
# request (see backend/data_sources/statcan_http.py) — this keeps the
# actual page loads fast and reliable by doing that work here instead,
# on a schedule with no user waiting on it.
#
# No extra setup needed beyond what daily-alerts.yml already requires:
# this reuses the same ALERTS_URL / ALERTS_SECRET repo secrets, just
# swapping the endpoint path.

on:
  schedule:
    - cron: "0 12 * * *"  # 12:00 UTC daily — an hour ahead of the alert check
  workflow_dispatch: {}

jobs:
  refresh-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Call the backend's /statcan/refresh-cache endpoint
        run: |
          if [ -z "${{ secrets.ALERTS_URL }}" ] || [ -z "${{ secrets.ALERTS_SECRET }}" ]; then
            echo "ALERTS_URL and/or ALERTS_SECRET repo secrets are not set yet — see README.md."
            exit 1
          fi

          REFRESH_URL="$(echo "${{ secrets.ALERTS_URL }}" | sed 's#/run-alerts$#/statcan/refresh-cache#')"

          # Render's free tier sleeps the backend after ~15 min idle, so the
          # first request of the day can take up to a minute to wake it up.
          # The endpoint itself responds immediately (the actual refresh
          # runs in the background), so this doesn't need a long timeout.
          http_code=$(curl -sS -o response.json -w "%{http_code}" -X POST "$REFRESH_URL" \
            -H "X-Alerts-Secret: ${{ secrets.ALERTS_SECRET }}" \
            --max-time 90)

          echo "HTTP status: $http_code"
          cat response.json
          echo

          if [ "$http_code" -ge 400 ]; then
            echo "The backend returned an error."
            exit 1
          fi

          echo "BASE_URL=$(echo "$REFRESH_URL" | sed 's#/statcan/refresh-cache$##')" >> "$GITHUB_ENV"

      - name: DIAGNOSTIC — test the raw single-call vector endpoint directly
        run: |
          # /statcan/vector/{id} calls only getDataFromVectorsAndLatestNPeriods
          # (one StatCan API call, no metadata/coordinate lookup calls first).
          # 111955442 is a known-good vector: Canada, Total (house and land) NHPI.
          # This checks whether THIS specific StatCan endpoint is reachable from
          # Render right now, independent of the cache/metadata calls that have
          # been timing out.
          http_code=$(curl -sS -o vector.json -w "%{http_code}" "$BASE_URL/statcan/vector/111955442?periods=12" --max-time 30)
          echo "GET /statcan/vector/111955442 -> HTTP $http_code"
          cat vector.json
          echo

      - name: Wait for the background refresh, then check what got cached
        run: |
          # The refresh above runs in the background on Render and can take
          # a few minutes (dozens of live StatCan calls). Wait, then hit the
          # public (no-secret-needed) /statcan/geographies endpoint — if
          # it's non-empty, the cache actually got populated.
          sleep 120
          http_code=$(curl -sS -o geographies.json -w "%{http_code}" "$BASE_URL/statcan/geographies" --max-time 30)
          echo "GET /statcan/geographies -> HTTP $http_code"
          echo "Response (first 2000 chars):"
          head -c 2000 geographies.json
          echo

          http_code=$(curl -sS -o price.json -w "%{http_code}" "$BASE_URL/statcan/price?geography=Canada&periods=8" --max-time 30)
          echo "GET /statcan/price?geography=Canada -> HTTP $http_code"
          cat price.json
          echo
